[versions]
agp = "9.3.0"
kotlin = "2.2.10"
composeBom = "2024.12.01"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
navigation = "2.8.5"
window = "1.3.0"
media3 = "1.5.1"

biometric = "1.1.0"
# 【避坑关键：锁定 fragment 1.8.5+，防止 FragmentActivity 16 位 requestCode 崩溃】
# androidx.biometric:1.1.0 内部传递依赖了远古的 fragment:1.2.5，其 checkForValidRequestCode() 会在 Compose
# 分配 16 位以上 requestCode 时抛出 "Can only use lower 16 bits for requestCode" 异常导致真机选图崩溃。
fragment = "1.8.5"
# GroMore 融合 SDK（含穿山甲 + 聚合；请求 104529400 必须用这个，不能只用 ads-sdk-pro）
# 双11样式适配：Maven 最新 mediation-sdk 7.8.1.4（≥ 公告建议 GroMore 7.8.0.9）
pangle = "7.8.1.4"
# Sigmob via GroMore：adapter / wind-sdk / wind-common 必须同线匹配。
# 公开 Maven 可解析到 4.25.14 线（官方 7.8.1.4 文档另列 4.25.82，暂无公开 wind 坐标）。
sigmobAdapter = "4.25.14.1"
sigmobWind = "4.25.14"
sigmobWindCommon = "2.0.1"
# 百度：GroMore 7.8.1.4 对应 adapter 9.4603.0。SDK 本体不在穿山甲仓库，Maven Central 最新是 9.460。
baiduAdapter = "9.4603.0"
baiduMobads = "9.460"
# 快手：GroMore 7.8.1.4 对应 adapter 5.7.20.1.0。SDK 本体不在 Maven，使用平台包 app/libs/kssdk-ad-5.7.20.1.aar。
kuaishouAdapter = "5.7.20.1.0"
# 优量汇：GroMore 7.8.1.4 对应 adapter 4.701.1571.0，SDK com.qq.e.union:union:4.701.1571。
gdtAdapter = "4.701.1571.0"
gdtUnion = "4.701.1571"
wechat = "6.8.34"
# 巨量广告转化 SDK（融合归因）。同意隐私后再初始化，用于激活归因。
appConvert = "2.0.6"

[libraries]
pangle-mediation-sdk = { group = "com.pangle.cn", name = "mediation-sdk", version.ref = "pangle" }
pangle-mediation-sigmob-adapter = { group = "com.pangle.cn", name = "mediation-sigmob-adapter", version.ref = "sigmobAdapter" }
sigmob-wind-sdk = { group = "com.yodo1.plugin.tobid", name = "wind-sdk", version.ref = "sigmobWind" }
sigmob-wind-common = { group = "com.yodo1.plugin.tobid", name = "wind-common", version.ref = "sigmobWindCommon" }
pangle-mediation-baidu-adapter = { group = "com.pangle.cn", name = "mediation-baidu-adapter", version.ref = "baiduAdapter" }
baidu-mobads = { group = "mobi.baidu.sdk", name = "mobads", version.ref = "baiduMobads" }
pangle-mediation-ks-adapter = { group = "com.pangle.cn", name = "mediation-ks-adapter", version.ref = "kuaishouAdapter" }
pangle-mediation-gdt-adapter = { group = "com.pangle.cn", name = "mediation-gdt-adapter", version.ref = "gdtAdapter" }
gdt-union = { group = "com.qq.e.union", name = "union", version.ref = "gdtUnion" }
wechat-sdk = { group = "com.tencent.mm.opensdk", name = "wechat-sdk-android", version.ref = "wechat" }
app-convert = { group = "com.bytedance.ads", name = "AppConvert", version.ref = "appConvert" }
# 显式覆盖并提升 fragment-ktx 版本，修复 ActivityResultRegistry 兼容性
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-window = { group = "androidx.window", name = "window", version.ref = "window" }
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
androidx-media3-database = { group = "androidx.media3", name = "media3-database", version.ref = "media3" }
androidx-media3-datasource = { group = "androidx.media3", name = "media3-datasource", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
