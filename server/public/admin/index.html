<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>词搭子 · 管理后台</title>
  <style>
    :root {
      --bg: #07140f;
      --panel: #0d2219;
      --panel-2: #123024;
      --line: rgba(110, 231, 183, 0.18);
      --cyan: #6ee7b7;
      --cyan-soft: #b8f5d6;
      --text: #e8fff3;
      --muted: #8aa89a;
      --danger: #fb7185;
      --warn: #fbbf24;
      --control-h: 40px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    a { color: var(--cyan); }
    button, input, select, textarea { font: inherit; }
    .hidden { display: none !important; }
    #login {
      min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: radial-gradient(circle at 50% 0%, #163c2c 0%, var(--bg) 55%);
    }
    .card {
      width: min(420px, 100%); background: var(--panel); border: 1px solid var(--line);
      border-radius: 18px; padding: 28px;
    }
    h1 { margin: 0 0 6px; font-size: 24px; color: var(--cyan-soft); }
    .sub { color: var(--muted); margin: 0 0 20px; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
    input, select, textarea {
      width: 100%; background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
      border-radius: 10px; padding: 0 12px; outline: none;
      height: var(--control-h); line-height: var(--control-h);
    }
    textarea {
      height: auto; min-height: 96px; line-height: 1.5; padding: 10px 12px; resize: vertical;
    }
    select {
      appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
        linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position: calc(100% - 16px) calc(50% - 3px), calc(100% - 11px) calc(50% - 3px);
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
      padding-right: 28px;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--cyan); }
    .btn {
      border: 0; border-radius: 10px; padding: 0 14px; cursor: pointer;
      background: var(--cyan); color: #062016; font-weight: 700;
      height: var(--control-h); display: inline-flex; align-items: center; justify-content: center;
      white-space: nowrap; flex: 0 0 auto;
    }
    .btn.ghost { background: var(--panel-2); color: var(--cyan-soft); border: 1px solid var(--line); }
    .btn.danger { background: #be123c; color: #fff; }
    .btn.small { height: 32px; padding: 0 10px; font-size: 12px; }
    .error { color: var(--danger); min-height: 20px; margin-top: 10px; }
    #app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
    aside {
      background: #081810; border-right: 1px solid var(--line); padding: 20px 14px;
      display: flex; flex-direction: column; gap: 8px;
    }
    aside .brand { color: var(--cyan-soft); font-weight: 800; font-size: 18px; margin: 4px 8px 16px; }
    .nav { background: transparent; color: var(--muted); text-align: left; border: 0; border-radius: 10px; padding: 10px 12px; cursor: pointer; }
    .nav.active, .nav:hover { background: var(--panel-2); color: var(--cyan-soft); }
    main { padding: 22px 26px 40px; }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
    .stat b { display: block; font-size: 26px; color: var(--cyan); }
    .stat span { color: var(--muted); font-size: 13px; }
    .toolbar {
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
      margin-bottom: 12px;
    }
    .toolbar > input,
    .toolbar > select,
    .toolbar > .btn {
      width: auto;
      flex: 0 0 auto;
    }
    .toolbar > input { min-width: 160px; max-width: 240px; }
    .field-inline {
      display: inline-flex; align-items: center; gap: 8px;
      margin: 0; color: var(--muted); font-size: 13px; white-space: nowrap;
      height: var(--control-h);
    }
    .field-inline select {
      width: auto; min-width: 96px;
    }
    table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 12px; overflow: hidden; }
    th, td {
      padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left;
      font-size: 13px; vertical-align: middle; line-height: 1.4;
    }
    th { color: var(--muted); font-weight: 600; background: #0a1c14; white-space: nowrap; }
    td.wrap { white-space: normal; word-break: break-word; }
    tr:hover td { background: rgba(110, 231, 183, 0.04); }
    .avatar {
      width: 64px; height: 64px; border-radius: 12px; object-fit: contain;
      border: 1px solid var(--line); background: #081810; display: block;
      cursor: pointer;
    }
    .avatar.empty {
      display: grid; place-items: center; color: var(--muted); font-size: 11px; cursor: default;
    }
    .avatar.lg {
      width: 168px; height: 168px; border-radius: 18px; object-fit: contain;
      background: #081810;
    }
    .img-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .img-row .avatar { width: 56px; height: 56px; }
    .modal img.preview {
      display: block; width: min(720px, 100%); height: auto; max-height: 78vh;
      object-fit: contain; border-radius: 14px; background: #081810;
    }
    .user-head { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 8px; }
    .profile-grid {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px;
      margin: 12px 0 18px; padding: 14px 16px; border-radius: 12px;
      border: 1px solid var(--line); background: var(--panel-2);
    }
    .profile-grid .item { min-width: 0; }
    .profile-grid .k { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
    .profile-grid .v { color: var(--text); word-break: break-word; }
    @media (max-width: 700px) {
      .profile-grid { grid-template-columns: 1fr; }
    }
    .pager { display: flex; gap: 8px; align-items: center; margin-top: 12px; color: var(--muted); }
    .tag {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 2px 8px; border-radius: 999px; font-size: 12px;
      background: var(--panel-2); color: var(--cyan-soft); white-space: nowrap;
    }
    .tag.bad { color: var(--danger); }
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; padding: 20px; z-index: 20; }
    .modal { width: min(980px, 100%); max-height: 90vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
    .modal table { table-layout: auto; }
    .modal td, .modal th { white-space: nowrap; }
    .modal td.wrap { white-space: normal; word-break: break-word; }
    pre { white-space: pre-wrap; word-break: break-all; color: var(--cyan-soft); font-size: 12px; }
    @media (max-width: 800px) {
      #app { grid-template-columns: 1fr; }
      aside { flex-direction: row; flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div id="login">
    <div class="card">
      <h1>词搭子管理后台</h1>
      <div class="sub">超级管理员登录</div>
      <label>账号</label>
      <input id="loginUser" autocomplete="username" />
      <label>密码</label>
      <input id="loginPass" type="password" autocomplete="current-password" />
      <div class="error" id="loginErr"></div>
      <button class="btn" style="width:100%;margin-top:8px" onclick="doLogin()">进入后台</button>
    </div>
  </div>

  <div id="app" class="hidden">
    <aside>
      <div class="brand">词搭子 Admin</div>
      <button class="nav active" data-page="overview" onclick="go('overview')">总览</button>
      <button class="nav" data-page="users" onclick="go('users')">用户</button>
      <button class="nav" data-page="logins" onclick="go('logins')">登录记录</button>
      <button class="nav" data-page="sms" onclick="go('sms')">短信记录</button>
      <button class="nav" data-page="notebooks" onclick="go('notebooks')">词书 / 生词本</button>
      <button class="nav" data-page="checkins" onclick="go('checkins')">签到积分</button>
      <button class="nav" data-page="gifts" onclick="go('gifts')">积分兑礼</button>
      <button class="nav" data-page="giftOrders" onclick="go('giftOrders')">兑换订单</button>
      <button class="nav" data-page="shorts" onclick="go('shorts')">短视频</button>
      <button class="nav" data-page="audit" onclick="go('audit')">操作日志</button>
      <div style="flex:1"></div>
      <div id="who" class="sub" style="margin:8px"></div>
      <button class="btn ghost" onclick="logout()">退出</button>
    </aside>
    <main>
      <div class="top">
        <h1 id="title">总览</h1>
        <div id="hint" class="sub"></div>
      </div>
      <div id="content"></div>
    </main>
  </div>

  <div id="modalRoot"></div>

<script>
const titles = {
  overview: ['总览', '注册用户、登录、词书与短信概况'],
  users: ['用户', '账号资料、头像、搭子号、收货地址、登录与改密'],
  logins: ['登录记录', '验证码 / 密码登录，成功与失败'],
  sms: ['短信记录', '验证码发送与是否已核销（不展示明文验证码）'],
  notebooks: ['词书 / 生词本', '系统词书可下架与改词；用户生词本可查看删除'],
  checkins: ['签到积分', '用户累计积分、连续签到与每日签到明细'],
  gifts: ['积分兑礼', '上架/下架礼品、库存与积分价格'],
  giftOrders: ['兑换订单', '用户兑换记录与发货状态'],
  shorts: ['短视频', '视频维护，以及用户在口语/单词/听力的累计停留'],
  audit: ['操作日志', '超级管理员在后台做过的事'],
};

const state = { page: 'overview', pageNo: 1, q: '', kind: '', giftPub: '', shortCat: '', shortPub: '', shortsView: 'list', shortDays: '30', notebookId: null, checkInView: 'users' };

function token() { return localStorage.getItem('hw_admin_token') || ''; }
function authHeaders() {
  return { Authorization: 'Bearer ' + token(), 'Content-Type': 'application/json' };
}
async function api(path, opts = {}) {
  const res = await fetch('/admin/api' + path, { ...opts, headers: { ...authHeaders(), ...(opts.headers || {}) } });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { logout(); throw new Error(data.error || '未登录'); }
  if (!res.ok) throw new Error(data.error || '请求失败');
  return data;
}
function fmt(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function methodLabel(m) {
  return ({ sms: '验证码', password: '密码', register: '注册设密', admin_reset: '管理员重置', set_after_sms: '验证后设密' }[m] || m || '—');
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function avatarCell(url, large) {
  if (!url) return `<span class="avatar empty${large ? ' lg' : ''}">无</span>`;
  const path = String(url).split('?')[0];
  const src = path + '?t=' + Date.now();
  return `<img class="avatar${large ? ' lg' : ''}" src="${esc(src)}" alt="头像" onclick="window.open('${esc(path)}','_blank')" title="查看原图" />`;
}
function providerLabel(p) {
  return ({ pollinations: 'Pollinations', siliconflow: '硅基流动' }[p] || p || 'AI');
}
function mnemonicSrc(id) {
  return '/admin/api/mnemonic-images/' + id + '?token=' + encodeURIComponent(token());
}
function wordImages(w) {
  const imgs = w.images || [];
  if (!imgs.length) return '<span class="sub">—</span>';
  return `<div class="img-row">${imgs.map((img) => {
    const title = `${providerLabel(img.provider)} · ${fmt(img.createdAt)}`;
    return `<img class="avatar" src="${esc(mnemonicSrc(img.id))}" alt="${esc(w.text)}" title="${esc(title)}" onclick="openMnemonic(${img.id},'${esc(w.text)}','${esc(title)}')" />`;
  }).join('')}</div>`;
}
function openMnemonic(id, word, title) {
  showModal(`<img class="preview" src="${esc(mnemonicSrc(id))}" alt="${esc(word)}" />
    <div class="sub" style="margin-top:10px">${esc(word)} · ${esc(title)}</div>`);
}

async function doLogin() {
  document.getElementById('loginErr').textContent = '';
  try {
    const data = await fetch('/admin/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('loginUser').value,
        password: document.getElementById('loginPass').value,
      }),
    }).then(async (r) => {
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || '登录失败');
      return j;
    });
    localStorage.setItem('hw_admin_token', data.token);
    showApp(data.admin);
  } catch (e) {
    document.getElementById('loginErr').textContent = e.message;
  }
}

function logout() {
  localStorage.removeItem('hw_admin_token');
  document.getElementById('app').classList.add('hidden');
  document.getElementById('login').classList.remove('hidden');
}

async function showApp(admin) {
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  if (!admin) {
    try { admin = (await api('/me')).admin; } catch { return; }
  }
  document.getElementById('who').textContent = '管理员 · ' + admin.username;
  go(state.page);
}

function go(page, extra = {}) {
  const pageChanged = state.page !== page;
  state.page = page;
  state.pageNo = extra.page || 1;
  if (extra.q != null) state.q = extra.q;
  if (extra.kind != null) state.kind = extra.kind;
  if (extra.giftPub != null) state.giftPub = extra.giftPub;
  if (extra.shortCat != null) state.shortCat = extra.shortCat;
  if (extra.shortPub != null) state.shortPub = extra.shortPub;
  if (extra.shortsView != null) state.shortsView = extra.shortsView;
  if (extra.shortDays != null) state.shortDays = extra.shortDays;
  if ('notebookId' in extra) {
    const prevNotebookId = state.notebookId;
    state.notebookId = extra.notebookId;
    if (!('q' in extra) && prevNotebookId !== extra.notebookId) state.q = '';
  } else if (pageChanged) {
    state.notebookId = null;
  }
  if (extra.checkInView != null) state.checkInView = extra.checkInView;
  document.querySelectorAll('.nav').forEach((el) => el.classList.toggle('active', el.dataset.page === page));
  document.getElementById('title').textContent = titles[page][0];
  document.getElementById('hint').textContent = titles[page][1];
  render();
}

function pager(total) {
  const pages = Math.max(1, Math.ceil(total / 20));
  return `<div class="pager">
    <button class="btn ghost small" ${state.pageNo<=1?'disabled':''} onclick="go(state.page,{page:${state.pageNo-1}})">上一页</button>
    <span>第 ${state.pageNo} / ${pages} 页 · 共 ${total} 条</span>
    <button class="btn ghost small" ${state.pageNo>=pages?'disabled':''} onclick="go(state.page,{page:${state.pageNo+1}})">下一页</button>
  </div>`;
}

async function render() {
  const el = document.getElementById('content');
  el.innerHTML = '加载中…';
  try {
    if (state.page === 'overview') {
      const d = await api('/overview');
      el.innerHTML = `
        <div class="stats">
          <div class="stat"><b>${d.stats.userCount}</b><span>注册用户</span></div>
          <div class="stat"><b>${d.stats.login7d}</b><span>近 7 天登录</span></div>
          <div class="stat"><b>${d.stats.wordCount}</b><span>词条总数</span></div>
          <div class="stat"><b>${d.stats.catalogCount}</b><span>系统词书</span></div>
          <div class="stat"><b>${d.stats.userNotebookCount}</b><span>用户生词本</span></div>
          <div class="stat"><b>${d.stats.sms24h}</b><span>近 24 小时短信</span></div>
          <div class="stat"><b>${d.stats.checkInToday ?? 0}</b><span>今日签到</span></div>
          <div class="stat"><b>${d.stats.checkInUsers ?? 0}</b><span>有积分用户</span></div>
        </div>
        <h3>最近注册</h3>
        ${userTable(d.recentUsers)}`;
    } else if (state.page === 'users') {
      const d = await api(`/users?page=${state.pageNo}&q=${encodeURIComponent(state.q)}`);
      el.innerHTML = `
        <div class="toolbar">
          <input style="max-width:280px" placeholder="搜索手机号 / 昵称 / 搭子号 / 邮箱 / 收货人" value="${esc(state.q)}" onkeydown="if(event.key==='Enter')go('users',{q:this.value,page:1})" />
          <button class="btn" onclick="go('users',{q:document.querySelector('main input').value,page:1})">搜索</button>
        </div>
        ${userTable(d.items, true)}
        ${pager(d.total)}`;
    } else if (state.page === 'logins') {
      const d = await api(`/logins?page=${state.pageNo}&q=${encodeURIComponent(state.q)}`);
      el.innerHTML = `
        <div class="toolbar">
          <input style="max-width:240px" placeholder="手机号 / 方式 / IP" value="${esc(state.q)}" onkeydown="if(event.key==='Enter')go('logins',{q:this.value,page:1})" />
          <button class="btn" onclick="go('logins',{q:document.querySelector('main input').value,page:1})">搜索</button>
        </div>
        <table><thead><tr><th>时间</th><th>手机号</th><th>方式</th><th>结果</th><th>设备</th><th>IP / 归属地</th></tr></thead>
        <tbody>${d.items.map(r => `<tr>
          <td>${fmt(r.createdAt)}</td><td>${esc(r.phone||'—')}</td>
          <td>${methodLabel(r.method)}</td>
          <td><span class="tag ${r.success?'':'bad'}">${r.success?'成功':'失败'}</span></td>
          <td>${esc(r.deviceLabel || r.devicePlatform || '—')}${r.deviceModel && r.deviceLabel && !String(r.deviceLabel).includes(r.deviceModel) ? `<div class="sub">${esc(r.deviceModel)}</div>` : ''}</td>
          <td>${esc(r.ip||'—')}${r.ipLocation?`<div class="sub">${esc(r.ipLocation)}</div>`:''}</td>
        </tr>`).join('')}</tbody></table>
        ${pager(d.total)}`;
    } else if (state.page === 'sms') {
      const d = await api(`/sms?page=${state.pageNo}&q=${encodeURIComponent(state.q)}`);
      el.innerHTML = `
        <div class="toolbar">
          <input style="max-width:240px" placeholder="搜索手机号" value="${esc(state.q)}" onkeydown="if(event.key==='Enter')go('sms',{q:this.value,page:1})" />
          <button class="btn" onclick="go('sms',{q:document.querySelector('main input').value,page:1})">搜索</button>
        </div>
        <table><thead><tr><th>发送时间</th><th>手机号</th><th>过期</th><th>核销</th></tr></thead>
        <tbody>${d.items.map(r => `<tr>
          <td>${fmt(r.createdAt)}</td><td>${esc(r.phone)}</td>
          <td>${fmt(r.expiresAt)}</td>
          <td><span class="tag ${r.consumed?'':'bad'}">${r.consumed?('已用 '+fmt(r.consumedAt)):'未使用'}</span></td>
        </tr>`).join('')}</tbody></table>
        ${pager(d.total)}`;
    } else if (state.page === 'notebooks') {
      if (state.notebookId) return renderWords(el);
      const d = await api(`/notebooks?page=${state.pageNo}&kind=${encodeURIComponent(state.kind)}&q=${encodeURIComponent(state.q)}`);
      el.innerHTML = `
        <div class="toolbar">
          <select onchange="go('notebooks',{kind:this.value,page:1})">
            <option value="" ${!state.kind?'selected':''}>全部</option>
            <option value="catalog" ${state.kind==='catalog'?'selected':''}>系统词书</option>
            <option value="user" ${state.kind==='user'?'selected':''}>用户生词本</option>
          </select>
          <input style="max-width:240px" placeholder="名称 / slug / 手机号" value="${esc(state.q)}" onkeydown="if(event.key==='Enter')go('notebooks',{q:this.value,page:1})" />
          <button class="btn" onclick="go('notebooks',{q:document.querySelector('main input').value,page:1})">搜索</button>
        </div>
        <table><thead><tr><th>ID</th><th>名称</th><th>类型</th><th>归属</th><th>词数</th><th>状态</th><th>创建</th><th></th></tr></thead>
        <tbody>${d.items.map(n => `<tr>
          <td>${n.id}</td>
          <td>${esc(n.name)}${n.slug?`<div class="sub">${esc(n.slug)}</div>`:''}</td>
          <td>${n.kind==='catalog'?'系统词书':'生词本'}</td>
          <td>${n.ownerPhone?esc(n.ownerPhone):'—'}</td>
          <td>${n.wordCount}</td>
          <td><span class="tag ${n.published?'':'bad'}">${n.published?'已发布':'已下架'}</span></td>
          <td>${fmt(n.createdAt)}</td>
          <td>
            <button class="btn small" onclick="go('notebooks',{notebookId:${n.id},page:1,q:''})">词条</button>
            ${n.kind==='catalog'
              ? `<button class="btn ghost small" onclick="toggleBook(${n.id},${n.published})">${n.published?'下架':'上架'}</button>`
              : `<button class="btn danger small" onclick="delBook(${n.id})">删除</button>`}
          </td>
        </tr>`).join('')}</tbody></table>

function genderHtml(g) {
  if (g === '男') return '<span style="color:#3B82F6;font-weight:700">♂</span> 男';
  if (g === '女') return '<span style="color:#EC4899;font-weight:700">♀</span> 女';
  if (g === '未知') return '<span style="color:#9CA3AF;font-weight:700">○</span> 未知';
  return esc(g || '—');
}
function shippingText(u) {
  const parts = [u.shippingName, u.shippingPhone, u.shippingDetail].filter(Boolean);
  return parts.length ? parts.join(' · ') : '—';
}
function userTable(items, actions) {
  return `<table><thead><tr>

  const isNew = !v || !v.id;
  const item = v || { category:'speaking', author:'词搭子', keywords:[], published:true, sortOrder:0, videoUrl:'' };
  const kw = Array.isArray(item.keywords) ? item.keywords.join(', ') : '';
  showModal(`<h2>${isNew?'新增短视频':'编辑短视频'}</h2>
    <label>标题</label><input id="sTitle" value="${esc(item.title||'')}" />

    <label>分类</label>
    <select id="sCat">
      <option value="speaking" ${item.category==='speaking'?'selected':''}>口语</option>
      <option value="vocab" ${item.category==='vocab'?'selected':''}>单词</option>
      <option value="listening" ${item.category==='listening'?'selected':''}>听力</option>
    </select>
    <label>关键词（3～5 个，逗号分隔）</label><input id="sKw" value="${esc(kw)}" placeholder="reply, messages, gossip" />
    <label>视频文件</label>
    <input id="sFile" type="file" accept="video/mp4,video/*" />
    <div class="sub" id="sUploadHint">${item.videoUrl ? '当前：'+esc(item.videoUrl) : '请选择 mp4 上传'}</div>
    <label>或直接填视频 URL</label><input id="sUrl" value="${esc(item.videoUrl||'')}" placeholder="/uploads/videos/xxx.mp4" />
    <label>时长（毫秒，可空）</label><input id="sDur" type="number" value="${item.durationMs??''}" />
    <label>排序（越小越靠前）</label><input id="sSort" type="number" value="${item.sortOrder||0}" />
    <label><input id="sPub" type="checkbox" ${item.published!==false?'checked':''}/> 上架</label>
    <div class="toolbar" style="margin-top:14px">
      <button class="btn" onclick="saveShort(${isNew?'null':item.id})">保存</button>
      <button class="btn ghost" onclick="closeModal()">取消</button>
    </div>`);
}
async function uploadShortFile() {
  const file = document.getElementById('sFile')?.files?.[0];
  if (!file) return document.getElementById('sUrl').value.trim();
  const hint = document.getElementById('sUploadHint');
  if (hint) hint.textContent = '上传中…';
  const res = await fetch('/admin/api/shorts/upload?filename=' + encodeURIComponent(file.name), {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + token(), 'Content-Type': file.type || 'video/mp4', 'X-Filename': file.name },
    body: file,
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { logout(); throw new Error(data.error || '未登录'); }
  if (!res.ok) throw new Error(data.error || '上传失败');
  document.getElementById('sUrl').value = data.url;
  if (hint) hint.textContent = '已上传：' + data.url;
  return data.url;
}
async function saveShort(id) {
  try {
    let videoUrl = document.getElementById('sUrl').value.trim();
    const file = document.getElementById('sFile')?.files?.[0];
    if (file) videoUrl = await uploadShortFile();
    const keywords = document.getElementById('sKw').value.split(/[,，、\n]/).map(s => s.trim()).filter(Boolean);
    const body = {
      title: document.getElementById('sTitle').value.trim(),
      author: document.getElementById('sAuthor').value.trim(),
      caption: document.getElementById('sCap').value.trim(),
      category: document.getElementById('sCat').value,
      keywords,
      videoUrl,
      durationMs: document.getElementById('sDur').value === '' ? null : Number(document.getElementById('sDur').value),
      sortOrder: Number(document.getElementById('sSort').value) || 0,
      published: document.getElementById('sPub').checked,
    };
    if (id == null) await api('/shorts', { method: 'POST', body: JSON.stringify(body) });
    else await api('/shorts/' + id, { method: 'PATCH', body: JSON.stringify(body) });
    closeModal(); go('shorts');
  } catch (e) { alert(e.message); }
}

  try { await api('/shorts/' + id, { method: 'PATCH', body: JSON.stringify({ published: !published }) }); go('shorts'); }
