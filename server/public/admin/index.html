<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>词搭子 · 管理后台</title>
  <style>
    :root {
      --bg: #07140f;
      --panel: #0d2219;
      --panel-2: #123024;
      --line: rgba(110, 231, 183, 0.18);
      --cyan: #6ee7b7;
      --cyan-soft: #b8f5d6;
      --text: #e8fff3;
      --muted: #8aa89a;
      --danger: #fb7185;
      --warn: #fbbf24;
      --control-h: 40px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    a { color: var(--cyan); }
    button, input, select, textarea { font: inherit; }
    .hidden { display: none !important; }
    #login {
      min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: radial-gradient(circle at 50% 0%, #163c2c 0%, var(--bg) 55%);
    }
    .card {
      width: min(420px, 100%); background: var(--panel); border: 1px solid var(--line);
      border-radius: 18px; padding: 28px;
    }
    h1 { margin: 0 0 6px; font-size: 24px; color: var(--cyan-soft); }
    .sub { color: var(--muted); margin: 0 0 20px; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
    input, select, textarea {
      width: 100%; background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
      border-radius: 10px; padding: 0 12px; outline: none;
      height: var(--control-h); line-height: var(--control-h);
    }
    input[type="checkbox"],
    input[type="radio"] {
      width: 16px;
      height: 16px;
      min-width: 16px;
      padding: 0;
      margin: 0 8px 0 0;
      border-radius: 4px;
      line-height: 1;
      vertical-align: middle;
      accent-color: var(--cyan);
      cursor: pointer;
      flex: 0 0 auto;
    }
    label:has(> input[type="checkbox"]),
    label:has(> input[type="radio"]) {
      display: inline-flex;
      align-items: center;
      gap: 0;
      cursor: pointer;
      color: var(--text);
      margin: 12px 0 6px;
    }
    textarea {
      height: auto; min-height: 96px; line-height: 1.5; padding: 10px 12px; resize: vertical;
    }
    select {
      appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
        linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position: calc(100% - 16px) calc(50% - 3px), calc(100% - 11px) calc(50% - 3px);
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
      padding-right: 28px;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--cyan); }
    .btn {
      border: 0; border-radius: 10px; padding: 0 14px; cursor: pointer;
      background: var(--cyan); color: #062016; font-weight: 700;
      height: var(--control-h); display: inline-flex; align-items: center; justify-content: center;
      white-space: nowrap; flex: 0 0 auto;
    }
    .btn.ghost { background: var(--panel-2); color: var(--cyan-soft); border: 1px solid var(--line); }
    .btn.danger { background: #be123c; color: #fff; }
    .btn.small { height: 32px; padding: 0 10px; font-size: 12px; }
    .error { color: var(--danger); min-height: 20px; margin-top: 10px; }
    #app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
    aside {
      background: #081810; border-right: 1px solid var(--line); padding: 20px 14px;
      display: flex; flex-direction: column; gap: 8px;
      position: sticky; top: 0; height: 100vh; overflow: hidden;
    }
    .nav-scroll {
      flex: 1; min-height: 0; overflow: auto;
      display: flex; flex-direction: column; gap: 8px;
    }
    aside .brand { color: var(--cyan-soft); font-weight: 800; font-size: 18px; margin: 4px 8px 16px; }
    .nav { background: transparent; color: var(--muted); text-align: left; border: 0; border-radius: 10px; padding: 10px 12px; cursor: pointer; }
    .nav.active, .nav:hover { background: var(--panel-2); color: var(--cyan-soft); }
    main { padding: 22px 26px 40px; min-width: 0; }
    .menu-btn {
      display: none; width: 40px; height: 40px; padding: 0; border: 1px solid var(--line);
      background: var(--panel); border-radius: 10px; cursor: pointer; flex: 0 0 auto;
      flex-direction: column; align-items: center; justify-content: center; gap: 5px;
    }
    .menu-btn span { display: block; width: 18px; height: 2px; border-radius: 2px; background: var(--cyan-soft); }
    .pull-refresh { display: none; }
    .nav-backdrop { display: none; }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; }
    .table-scroll { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 12px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
    .stat b { display: block; font-size: 26px; color: var(--cyan); }
    .stat b small { font-size: 14px; font-weight: 600; margin-left: 2px; }
    .stat span { color: var(--muted); font-size: 13px; }
    .stat-split { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; line-height: 1.4; }
    .stat-split b { display: inline; color: var(--cyan); font-size: 16px; font-weight: 700; }
    .toolbar {
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
      margin-bottom: 12px;
    }
    .toolbar > input,
    .toolbar > select,
    .toolbar > .btn {
      width: auto;
      flex: 0 0 auto;
    }
    .toolbar > input { min-width: 160px; max-width: 240px; }
    .toolbar > input.search-wide { width: 520px; min-width: 520px; max-width: none; }
    .field-inline {
      display: inline-flex; align-items: center; gap: 8px;
      margin: 0; color: var(--muted); font-size: 13px; white-space: nowrap;
      height: var(--control-h);
    }
    .field-inline select {
      width: auto; min-width: 96px;
    }
    table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 12px; overflow: hidden; }
    table.user-list { width: max-content; min-width: 100%; }
    table.user-list th, table.user-list td { white-space: nowrap; }
    table.user-list .sub { margin: 0 0 0 6px; }
    th, td {
      padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left;
      font-size: 13px; vertical-align: middle; line-height: 1.4;
    }
    th { color: var(--muted); font-weight: 600; background: #0a1c14; white-space: nowrap; }
    td.wrap { white-space: normal; word-break: break-word; }
    td.nowrap { white-space: nowrap; }
    td.nowrap .sub { margin: 0 0 0 6px; }
    tr:hover td { background: rgba(110, 231, 183, 0.04); }
    tr.system-book td { background: #163044; }
    tr.system-book:hover td { background: #1c3a50; }
    .avatar {
      width: 64px; height: 64px; border-radius: 12px; object-fit: contain;
      border: 1px solid var(--line); background: #081810; display: block;
      cursor: pointer;
    }
    .device-cell { width: 40px; text-align: center; }
    .device-mark { width: 22px; height: 22px; display: inline-block; vertical-align: middle; }
    .device-mark.android { color: #3ddc84; }
    .device-mark.ios { color: #f4f4f5; }
    .device-mark.pc { color: var(--cyan-soft); }
    .login-kind { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .login-kind svg { width: 22px; height: 22px; display: block; }
    .login-kind.child { color: #7dd3fc; }
    .login-kind.elder { color: #fbbf24; }
    .user-with-device { display: flex; align-items: center; gap: 8px; }
    .user-with-device .sub { margin: 0; }
    .medal { width: 22px; height: 22px; display: inline-block; vertical-align: middle; }
    .field-clear { position: relative; display: inline-flex; align-items: center; max-width: 110px; }
    .field-clear.wide { max-width: 240px; }
    .field-clear input { width: 100%; padding-right: 28px; }
    .field-x {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      width: 18px; height: 18px; border: 0; border-radius: 999px; padding: 0;
      background: rgba(255, 255, 255, .14); color: var(--text); cursor: pointer;
      line-height: 16px; font-size: 14px;
    }
    .field-x[hidden] { display: none; }
    .avatar.empty {
      display: grid; place-items: center; color: var(--muted); font-size: 11px; cursor: default;
    }
    .avatar.lg {
      width: 168px; height: 168px; border-radius: 18px; object-fit: contain;
      background: #081810;
    }
    .img-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .img-row .avatar { width: 56px; height: 56px; }
    .modal img.preview {
      display: block; width: min(720px, 100%); height: auto; max-height: 78vh;
      object-fit: contain; border-radius: 14px; background: #081810;
    }
    .user-head { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 8px; }
    .profile-grid {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px;
      margin: 12px 0 18px; padding: 14px 16px; border-radius: 12px;
      border: 1px solid var(--line); background: var(--panel-2);
    }
    .profile-grid .item { min-width: 0; }
    .profile-grid .k { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
    .profile-grid .v { color: var(--text); word-break: break-word; }
    @media (max-width: 700px) {
      .profile-grid { grid-template-columns: 1fr; }
    }
    .pager { display: flex; gap: 8px; align-items: center; margin-top: 12px; color: var(--muted); }
    .tag {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 2px 8px; border-radius: 999px; font-size: 12px;
      background: var(--panel-2); color: var(--cyan-soft); white-space: nowrap;
    }
    .tag.bad { color: var(--danger); }
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; padding: 20px; z-index: 20; }
    .modal { width: min(980px, 100%); max-height: 90vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
    .modal table { table-layout: auto; }
    .modal td, .modal th { white-space: nowrap; }
    .modal td.wrap { white-space: normal; word-break: break-word; }
    pre { white-space: pre-wrap; word-break: break-all; color: var(--cyan-soft); font-size: 12px; }
    .cockpit-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; min-width: 0; }
    .chart-card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 14px 8px; min-width: 0; max-width: 100%; }
    .chart-card h3 { margin: 0 0 4px; font-size: 15px; color: var(--cyan-soft); }
    .chart-card .note { color: var(--muted); font-size: 12px; margin: 0 0 8px; }
    .chart-card svg, .map-svg { width: 100%; max-width: 100%; height: auto; display: block; overflow: hidden; }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 4px 0 8px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
    .plat-row { display: grid; grid-template-columns: 88px 1fr 48px; gap: 8px; align-items: center; margin: 8px 0; font-size: 13px; }
    .plat-bar { height: 8px; border-radius: 99px; background: #081810; overflow: hidden; }
    .plat-bar i { display: block; height: 100%; background: var(--cyan); border-radius: 99px; }
    .map-layout { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(240px, 0.75fr); gap: 16px; align-items: start; }
    .map-stage { position: relative; background: #081810; border-radius: 12px; }
    .map-svg { width: 100%; height: auto; display: block; }
    .map-svg .prov { stroke: #07140f; stroke-width: 0.7; cursor: pointer; }
    .map-svg .prov.hot { stroke: #ecfdf5; stroke-width: 1.6; }
    .map-svg .sea { fill: none; stroke: #8fb9a4; stroke-width: 0.8; }
    #mapTip {
      position: absolute; z-index: 2; pointer-events: none;
      background: #052016; color: #ecfdf5; border: 1px solid #245c45;
      border-radius: 8px; padding: 6px 10px; font-size: 13px; white-space: nowrap;
    }
    .map-scale { display: flex; align-items: center; gap: 8px; margin-top: 8px; color: var(--muted); font-size: 12px; }
    .map-scale i { width: 120px; height: 8px; border-radius: 99px; background: linear-gradient(90deg, #163d2c, #6ee7b7); }
    .map-rank { padding-right: 4px; }
    .map-rank-row { display: grid; grid-template-columns: max-content minmax(0, 1fr) 52px; gap: 8px; align-items: center; padding: 5px 6px; border-radius: 8px; font-size: 13px; }
    .map-rank-row > span:first-child { white-space: nowrap; }
    .map-rank-row.hot { background: #123528; }
    .map-rank-row b { text-align: right; color: var(--cyan-soft); }
    .map-rank .mini { height: 6px; border-radius: 99px; background: #081810; overflow: hidden; }
    .map-rank .mini i { display: block; height: 100%; background: var(--cyan); border-radius: 99px; }
    @media (max-width: 1100px) {
      .map-layout { grid-template-columns: 1fr; }
    }
    @media (max-width: 1100px) {
      .cockpit-grid { grid-template-columns: minmax(0, 1fr); }
    }
    .cards-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 12px 0 18px; }
    @media (max-width: 800px) {
      #login { padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); }
      .card { padding: 22px 16px; }
      #app { display: block; min-height: 100vh; }
      .menu-btn { display: inline-flex; }
      .nav-backdrop {
        position: fixed; inset: 0; z-index: 25; background: rgba(0, 0, 0, .55);
      }
      body.nav-open { overflow: hidden; }
      body.nav-open .nav-backdrop { display: block; }
      aside {
        position: fixed; z-index: 30; top: 0; bottom: 0; left: 0;
        width: min(280px, 86vw); height: 100%; overflow: hidden;
        transform: translateX(-105%); transition: transform .2s ease;
        flex-direction: column; flex-wrap: nowrap;
        padding-top: max(16px, env(safe-area-inset-top));
        padding-bottom: max(16px, env(safe-area-inset-bottom));
      }
      body.nav-open aside { transform: none; }
      aside .nav { width: 100%; padding: 12px 14px; font-size: 15px; }
      aside .btn { width: 100%; }
      html, body { overscroll-behavior-y: none; }
      main {
        min-height: 100vh;
        padding: 12px 14px calc(28px + env(safe-area-inset-bottom));
      }
      .pull-refresh {
        display: flex;
        position: fixed;
        z-index: 40;
        top: 0; left: 0; right: 0;
        height: 0;
        overflow: hidden;
        align-items: center;
        justify-content: center;
        color: var(--cyan-soft);
        pointer-events: none;
      }
      .pull-arrow { width: 22px; height: 22px; display: block; transform-origin: center; }
      .pull-refresh.refreshing .pull-arrow { animation: pull-spin .7s linear infinite; }
      @keyframes pull-spin { to { transform: rotate(360deg); } }
      .top {
        position: sticky; top: 0; z-index: 6; flex-wrap: wrap; align-items: center;
        margin: 0 -14px 14px; padding: max(8px, env(safe-area-inset-top)) 14px 10px;
        background: var(--bg);
      }
      .top h1 { flex: 1; margin: 0; font-size: 20px; }
      .top .sub { flex: 1 0 100%; margin: 6px 0 0; font-size: 13px; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .stat { padding: 12px; }
      .stat b { font-size: 20px; overflow-wrap: anywhere; }
      .toolbar > .btn { flex: 0 0 auto; }
      .toolbar input:not([type="checkbox"]):not([type="radio"]):not([type="file"]):not([type="date"]):not([type="month"]):not([type="number"]),
      .toolbar select {
        flex: 1 1 100%; width: auto; min-width: 0; max-width: none !important;
      }
      .toolbar input[type="date"],
      .toolbar input[type="month"],
      .toolbar input[type="number"] {
        flex: 1 1 120px; width: auto; min-width: 0; max-width: none !important;
      }
      .toolbar .field-clear { flex: 1 1 100%; max-width: none; width: 100%; }
      .toolbar .field-clear input { max-width: none !important; width: 100%; }
      .field-inline { display: flex; width: 100%; height: auto; white-space: normal; }
      .field-inline input, .field-inline select { width: auto; flex: 1; min-width: 0; max-width: none; }
      input, select, textarea { font-size: 16px; }
      input[type="file"] { height: auto; line-height: 1.4; padding: 8px; }
      .table-scroll table { min-width: 560px; }
      .table-scroll th, .table-scroll td { white-space: nowrap; }
      .table-scroll td.wrap, .table-scroll pre { white-space: pre-wrap; }
      .pager { flex-wrap: wrap; }
      .cards-3 { grid-template-columns: 1fr; }
      .user-head { flex-direction: column; }
      .avatar.lg { width: 120px; height: 120px; }
      .plat-row { grid-template-columns: 72px 1fr 42px; }
      .map-rank { max-height: none; overflow: visible; }
      #content, .cockpit-grid, .chart-card, .map-layout, .map-stage, .stats { min-width: 0; max-width: 100%; }
      .modal-bg { padding: 0; place-items: end center; }
      .modal {
        width: 100%; max-height: 92vh; border-radius: 16px 16px 0 0;
        padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
      }
      .modal img.preview { max-height: 62vh; }
    }
  </style>
</head>
<body>
  <div id="login">
    <div class="card">
      <h1>词搭子管理后台</h1>
      <div class="sub">超级管理员登录</div>
      <label>账号</label>
      <input id="loginUser" autocomplete="username" />
      <label>密码</label>
      <input id="loginPass" type="password" autocomplete="current-password" />
      <div class="error" id="loginErr"></div>
      <button class="btn" style="width:100%;margin-top:8px" onclick="doLogin()">进入后台</button>
    </div>
  </div>

  <div class="nav-backdrop" onclick="closeNav()"></div>
  <div id="app" class="hidden">
    <aside>
      <div class="brand">词搭子 Admin</div>
      <div class="nav-scroll">
      <button class="nav active" data-page="cockpit" onclick="go('cockpit')">驾驶舱</button>
      <button class="nav" data-page="overview" onclick="go('overview')">总览</button>
      <button class="nav" data-page="users" onclick="go('users')">用户</button>
      <button class="nav" data-page="retention" onclick="go('retention')">留存活跃</button>
      <button class="nav" data-page="closedUsers" onclick="go('closedUsers')">注销用户</button>
      <button class="nav" data-page="logins" onclick="go('logins')">登录记录</button>
      <button class="nav" data-page="sms" onclick="go('sms')">短信记录</button>
      <button class="nav" data-page="notebooks" onclick="go('notebooks')">词书 / 生词本</button>
      <button class="nav" data-page="checkins" onclick="go('checkins')">签到搭币</button>
      <button class="nav" data-page="adwatches" onclick="go('adwatches')">广告观看</button>
      <button class="nav" data-page="adRevenue" onclick="go('adRevenue')">广告收益</button>
      <button class="nav" data-page="inviteAds" onclick="go('inviteAds')">邀请观看</button>
      <button class="nav" data-page="gifts" onclick="go('gifts')">搭币兑礼</button>
      <button class="nav" data-page="giftOrders" onclick="go('giftOrders')">兑换订单</button>
      <button class="nav" data-page="withdrawals" onclick="go('withdrawals')">提现记录</button>
      <button class="nav" data-page="purchases" onclick="go('purchases')">购买记录</button>
      <button class="nav" data-page="shorts" onclick="go('shorts')">短视频</button>
      <button class="nav" data-page="audit" onclick="go('audit')">操作日志</button>
      </div>
      <div id="who" class="sub" style="margin:8px"></div>
      <button class="btn ghost" onclick="logout()">退出</button>
    </aside>
    <div id="pullRefresh" class="pull-refresh" aria-hidden="true">
      <svg class="pull-arrow" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M17.65 6.35A7.95 7.95 0 0 0 12 4C7.58 4 4.01 7.58 4.01 12S7.58 20 12 20c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
      </svg>
    </div>
    <main>
      <div class="top">
        <button class="menu-btn" type="button" onclick="toggleNav()" aria-label="打开菜单" aria-expanded="false"><span></span><span></span><span></span></button>
        <h1 id="title">驾驶舱</h1>
        <div id="hint" class="sub"></div>
      </div>
      <div id="content"></div>
    </main>
  </div>

  <div id="modalRoot"></div>

<script>
const titles = {
  cockpit: ['驾驶舱', '各省注册人数、新增注销、活跃、观看时长、签到与兑礼'],
  overview: ['总览', '注册用户、登录、词书与短信概况'],
  users: ['用户', '账号资料、头像、搭子号、收货地址、登录与改密'],
  retention: ['留存活跃', '近 7 日 / 30 日活跃人数，以及注册后第 7 天、第 30 天的留存'],
  closedUsers: ['注销用户', '冷静期结束后保留的账号。同一手机号再注册不算新用户，不发新用户搭币'],
  logins: ['登录记录', '验证码 / 密码登录，成功与失败'],
  sms: ['短信记录', '验证码发送与是否已核销（不展示明文验证码）'],

  } else if (pageChanged) {

  }

  if (extra.withdrawDate != null) state.withdrawDate = extra.withdrawDate;

function fmtDuration(ms) {
  const n = Math.max(0, Number(ms) || 0);
  const hours = n / 3600000;
  if (hours >= 1) {
    const rounded = Math.round(hours * 10) / 10;
    return (Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1)) + '小时';
  }
  return Math.floor(n / 60000) + '分钟';
}

function niceMax(max) {
  if (max <= 1) return 1;
  if (max <= 2) return 2;
  if (max <= 5) return 5;
  const pow = Math.pow(10, Math.floor(Math.log10(max)));
  const n = max / pow;
  const nice = n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10;
  return nice * pow;
}

function formatTick(v) {
  if (v >= 10000) return (v / 10000).toFixed(v >= 100000 ? 0 : 1) + '万';
  if (Math.abs(v - Math.round(v)) < 0.05) return String(Math.round(v));
  return v.toFixed(1);
}

function cockpitFrame(series, maxValue) {
  const W = 720, H = 236;
  const pad = { l: 48, r: 12, t: 14, b: 34 };
  const innerW = W - pad.l - pad.r;
  const innerH = H - pad.t - pad.b;
  const nice = niceMax(maxValue);
  const n = Math.max(1, series.length);
  let grid = '';
  for (let t = 0; t <= 4; t++) {
    const val = nice * (4 - t) / 4;
    const y = pad.t + (innerH * t) / 4;
    grid += `<line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${W - pad.r}" y2="${y.toFixed(1)}" stroke="rgba(110,231,183,0.12)" />`;
    grid += `<text x="${pad.l - 6}" y="${(y + 3).toFixed(1)}" text-anchor="end" fill="#8aa89a" font-size="10">${formatTick(val)}</text>`;
  }
  const step = n > 18 ? 3 : n > 12 ? 2 : 1;
  const slot = innerW / n;
  let labels = '';
  series.forEach((p, i) => {
    if (i % step !== 0 && i !== n - 1) return;
    const x = pad.l + i * slot + slot / 2;
    labels += `<text x="${x.toFixed(1)}" y="${H - 10}" text-anchor="middle" fill="#8aa89a" font-size="10">${esc(p.label)}</text>`;
  });
  return { W, H, pad, innerW, innerH, nice, n, slot, grid, labels };
}

function cockpitBars(series, keys) {
  const max = Math.max(1, ...series.flatMap((p) => keys.map((k) => Number(p[k.key]) || 0)));
  const frame = cockpitFrame(series, max);
  const gap = Math.min(8, frame.slot * 0.22);
  const barW = Math.max(1.5, (frame.slot - gap) / keys.length);
  let bars = '';
  series.forEach((p, i) => {
    keys.forEach((k, ki) => {
      const v = Number(p[k.key]) || 0;
      const h = (v / frame.nice) * frame.innerH;
      const x = frame.pad.l + i * frame.slot + gap / 2 + ki * barW;
      const y = frame.pad.t + frame.innerH - h;
      bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(1, barW - 1).toFixed(1)}" height="${Math.max(0, h).toFixed(1)}" rx="2" fill="${k.color}"><title>${esc(p.label)} ${esc(k.label)} ${formatTick(v)}</title></rect>`;
    });
  });
  const legend = keys.map((k) => `<span><i style="background:${k.color}"></i>${esc(k.label)}</span>`).join('');
  return { svg: `<svg viewBox="0 0 ${frame.W} ${frame.H}" role="img">${frame.grid}${bars}${frame.labels}</svg>`, legend };
}

function cockpitLine(series, key, color, label) {
  const max = Math.max(1, ...series.map((p) => Number(p[key]) || 0));
  const frame = cockpitFrame(series, max);
  const coords = series.map((p, i) => {
    const v = Number(p[key]) || 0;
    const x = frame.pad.l + i * frame.slot + frame.slot / 2;
    const y = frame.pad.t + frame.innerH - (v / frame.nice) * frame.innerH;
    return { x, y, v, label: p.label };
  });
  const d = coords.map((c, i) => `${i ? 'L' : 'M'}${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(' ');
  const area = coords.length
    ? `${d} L${coords[coords.length - 1].x.toFixed(1)},${(frame.pad.t + frame.innerH).toFixed(1)} L${coords[0].x.toFixed(1)},${(frame.pad.t + frame.innerH).toFixed(1)} Z`
    : '';
  const dots = coords.map((c) => `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="2.4" fill="${color}"><title>${esc(c.label)} ${esc(label)} ${formatTick(c.v)}</title></circle>`).join('');
  const legend = `<span><i style="background:${color}"></i>${esc(label)}</span>`;
  return {
    svg: `<svg viewBox="0 0 ${frame.W} ${frame.H}" role="img">${frame.grid}<path d="${area}" fill="${color}" opacity="0.16" /><path d="${d}" fill="none" stroke="${color}" stroke-width="2" />${dots}${frame.labels}</svg>`,
    legend,
  };
}

let chinaMapPromise = null
function loadChinaMap() {
  if (!chinaMapPromise) {
    chinaMapPromise = fetch('/admin/china-provinces.json').then((res) => {
      if (!res.ok) throw new Error('地图数据加载失败')
      return res.json()
    }).catch((err) => {
      chinaMapPromise = null
      throw err
    })
  }
  return chinaMapPromise
}
function provinceFill(count, max) {
  if (!count || !max) return '#163d2c'
  const t = Math.pow(count / max, 0.55)
  const mix = (from, to) => Math.round(from + (to - from) * t)
  return `rgb(${mix(22, 110)},${mix(61, 231)},${mix(44, 183)})`
}
function geoPolygons(feature) {
  if (feature.type === 'Polygon') return [feature.coordinates]
  if (feature.type === 'MultiPolygon') return feature.coordinates
  return []
}
function makeProjector(minLon, maxLon, minLat, maxLat, x0, y0, x1, y1) {
  const cos = Math.cos(((minLat + maxLat) / 2) * Math.PI / 180)
  const spanX = Math.max(0.01, (maxLon - minLon) * cos)
  const spanY = Math.max(0.01, maxLat - minLat)
  const s = Math.min((x1 - x0) / spanX, (y1 - y0) / spanY)
  const ox = x0 + ((x1 - x0) - spanX * s) / 2
  const oy = y0 + ((y1 - y0) - spanY * s) / 2
  return (lon, lat) => [ox + (lon - minLon) * cos * s, oy + (maxLat - lat) * s]
}
function ringsToPath(polys, project) {
  let d = ''
  for (const poly of polys) {
    for (const ring of poly) {
      if (!ring || ring.length < 3) continue
      ring.forEach((pt, i) => {
        const [x, y] = project(pt[0], pt[1])
        d += `${i ? 'L' : 'M'}${x.toFixed(1)},${y.toFixed(1)}`
      })
      d += 'Z'
    }
  }
  return d
}
function splitSouth(feature) {
  const main = []
  const south = []
  for (const poly of geoPolygons(feature)) {
    const outer = poly[0] || []
    const maxLat = outer.reduce((m, pt) => Math.max(m, pt[1]), -90)
    if (feature.name === '南海诸岛' || maxLat < 17) south.push(poly)
    else main.push(poly)
  }
  return { main, south }
}
function chinaMapSvg(geo, byName, max) {
  const project = makeProjector(73.4, 135.1, 17.8, 53.7, 8, 8, 632, 500)
  const southFeatures = []
  const paths = []
  for (const feature of geo) {
    const parts = splitSouth(feature)
    if (parts.south.length) southFeatures.push({ feature, polys: parts.south })
    if (!parts.main.length || feature.name === '南海诸岛') continue
    const info = byName[feature.name] || { short: feature.name.replace(/省|市|自治区|特别行政区|壮族|回族|维吾尔/g, ''), count: 0 }
    const d = ringsToPath(parts.main, project)
    paths.push(`<path class="prov" data-name="${esc(feature.name)}" data-short="${esc(info.short)}" data-count="${info.count || 0}" d="${d}" fill="${provinceFill(info.count || 0, max)}"><title>${esc(info.short)} ${info.count || 0} 人</title></path>`)
  }
  let inset = ''
  if (southFeatures.length) {
    let minLon = 180, maxLon = -180, minLat = 90, maxLat = -90
    for (const item of southFeatures) {
      for (const poly of item.polys) {
        for (const ring of poly) {
          for (const pt of ring) {
            minLon = Math.min(minLon, pt[0])
            maxLon = Math.max(maxLon, pt[0])
            minLat = Math.min(minLat, pt[1])
            maxLat = Math.max(maxLat, pt[1])
          }
        }
      }
    }
    const insetProject = makeProjector(minLon - 0.4, maxLon + 0.4, minLat - 0.4, maxLat + 0.4, 508, 392, 626, 520)
    const bits = southFeatures.map((item) => {
      const sea = item.feature.name === '南海诸岛'
      const info = byName[item.feature.name]
      const fill = sea ? 'none' : provinceFill(info?.count || 0, max)
      const data = sea ? '' : ` data-name="${esc(item.feature.name)}" data-short="${esc(info?.short || '海南')}" data-count="${info?.count || 0}"`
      const stroke = sea ? ' stroke="#8fb9a4" stroke-width="1"' : ''
      return `<path class="${sea ? 'sea' : 'prov'}"${data} d="${ringsToPath(item.polys, insetProject)}" fill="${fill}"${stroke}></path>`
    }).join('')
    inset = `<rect x="498" y="376" width="136" height="168" rx="8" fill="#081810" stroke="#1c3d30"/>${bits}<text x="566" y="534" text-anchor="middle" fill="#8fb9a4" font-size="11">南海诸岛</text>`
  }
  return `<svg class="map-svg" viewBox="0 0 640 560" role="img" aria-label="各省注册用户">${paths.join('')}${inset}</svg>`
}
function renderProvinceMap(stats, geo) {
  if (!stats) return ''
  const provinces = stats.provinces || []
  const byName = Object.fromEntries(provinces.map((item) => [item.name, item]))
  const max = Math.max(1, ...provinces.map((item) => Number(item.count) || 0))
  let svg = ''
  if (geo) {
    try { svg = chinaMapSvg(geo, byName, max) } catch (err) { svg = '' }
  }
  const ranked = provinces.filter((item) => item.count > 0).sort((a, b) => b.count - a.count || a.short.localeCompare(b.short, 'zh'))
  const emptyProvinces = provinces.filter((item) => !item.count).sort((a, b) => a.short.localeCompare(b.short, 'zh'))
  const countryMax = Math.max(max, ...(stats.countries || []).map((item) => Number(item.count) || 0))
  const countryRows = (stats.countries || []).filter((item) => item.count > 0).map((item) => `
    <div class="map-rank-row">
      <span>${esc(item.name)}</span>
      <div class="mini"><i style="width:${((item.count / countryMax) * 100).toFixed(1)}%"></i></div>
      <b>${fmtCount(item.count)}</b>
    </div>`).join('')
  const extras = [
    ['本地/内网', stats.local],
    ['未识别', stats.unknown],
  ].filter(([, n]) => Number(n) > 0)
  const rows = ranked.map((item) => `
    <div class="map-rank-row" data-name="${esc(item.name)}">
      <span>${esc(item.short)}</span>
      <div class="mini"><i style="width:${((item.count / countryMax) * 100).toFixed(1)}%"></i></div>
      <b>${fmtCount(item.count)}</b>
    </div>`).join('')
  const zeroRows = emptyProvinces.map((item) => `
    <div class="map-rank-row" data-name="${esc(item.name)}">
      <span>${esc(item.short)}</span>
      <div class="mini"></div>
      <b>0</b>
    </div>`).join('')
  const extraRows = extras.map(([label, n]) => `
    <div class="map-rank-row">
      <span>${esc(label)}</span>
      <div class="mini"></div>
      <b>${fmtCount(n)}</b>
    </div>`).join('')
  const empty = ranked.length || emptyProvinces.length ? '' : '<p class="note">还没有能归到省份的注册用户。</p>'
  return `
    <div class="chart-card" style="margin-bottom:14px">
      <h3>注册用户分布</h3>
      <p class="note">按注册后第一次成功登录的网络属地归省。属地是本地或识别不到时，改用个人资料里的地区，再不行用最近一次登录属地。颜色越亮，人越多。点省份或移上去可看人数。已归省 ${fmtCount(stats.located)} / 共 ${fmtCount(stats.total)} 人。</p>
      <div class="map-layout">
        <div>
          <div class="map-stage">
            ${svg || '<p class="note">地图暂时打不开，右边仍是各省人数。</p>'}
            <div id="mapTip" hidden></div>
          </div>
          <div class="map-scale"><span>少</span><i></i><span>多</span></div>
        </div>
        <div class="map-rank">
          ${rows || empty}
          ${countryRows}
          ${zeroRows}
          ${extraRows}
        </div>
      </div>
    </div>`
}
function bindProvinceMap(root) {
  const tip = root.querySelector('#mapTip')
  const stage = root.querySelector('.map-stage')
  if (!tip || !stage) return
  const rows = [...root.querySelectorAll('.map-rank-row')]
  root.querySelectorAll('path.prov').forEach((path) => {
    const mark = (on) => {
      path.classList.toggle('hot', on)
      rows.forEach((row) => row.classList.toggle('hot', on && row.dataset.name === path.dataset.name))
    }
    path.addEventListener('mouseenter', () => mark(true))
    path.addEventListener('mousemove', (event) => {
      mark(true)
      tip.hidden = false
      tip.textContent = `${path.dataset.short} ${fmtCount(path.dataset.count)} 人`
      const box = stage.getBoundingClientRect()
      let left = event.clientX - box.left + 14
      let top = event.clientY - box.top + 14
      if (left > box.width - 120) left = event.clientX - box.left - 120
      if (top > box.height - 36) top = event.clientY - box.top - 36
      tip.style.left = `${left}px`
      tip.style.top = `${top}px`
    })
    path.addEventListener('mouseleave', () => {
      mark(false)
      tip.hidden = true
    })
    path.addEventListener('click', (event) => {
      mark(true)
      tip.hidden = false
      tip.textContent = `${path.dataset.short} ${fmtCount(path.dataset.count)} 人`
      const box = stage.getBoundingClientRect()
      let left = event.clientX - box.left + 14
      let top = event.clientY - box.top + 14
      if (left > box.width - 120) left = Math.max(8, event.clientX - box.left - 120)
      if (top > box.height - 36) top = Math.max(8, event.clientY - box.top - 36)
      tip.style.left = `${left}px`
      tip.style.top = `${top}px`
    })
  })
  rows.forEach((row) => {
    if (!row.dataset.name) return
    row.addEventListener('mouseenter', () => {
      root.querySelectorAll('path.prov').forEach((path) => {
        path.classList.toggle('hot', path.dataset.name === row.dataset.name)
      })
      rows.forEach((other) => other.classList.toggle('hot', other === row))
    })
    row.addEventListener('mouseleave', () => {
      root.querySelectorAll('path.prov').forEach((path) => path.classList.remove('hot'))
      rows.forEach((other) => other.classList.remove('hot'))
    })
    row.addEventListener('click', () => {
      const on = !row.classList.contains('hot')
      root.querySelectorAll('path.prov').forEach((path) => {
        path.classList.toggle('hot', on && path.dataset.name === row.dataset.name)
      })
      rows.forEach((other) => other.classList.toggle('hot', on && other === row))
    })
  })
}

function iosUserRows(users, grain, emptyText) {

  const body = users.map((u) => `<tr>

    <td>${esc(u.phone || '—')}</td>

    ${showDays ? `<td>${fmtCount(u.days)}</td>` : ''}

  return `<table><thead>${head}</thead><tbody>${body}</tbody></table>`;

let renderTicket = 0;
async function render(opts = {}) {
  const ticket = ++renderTicket;
  const node = document.getElementById('content');
  if (state.page === 'adRevenue') {
    if (!state.adRevenueReady) {
      node.innerHTML = '加载中…';
      try {
        const saved = await api('/ad-revenue');
        if (ticket !== renderTicket) return;
        state.adRevenue = saved;
      } catch (e) {
        if (ticket !== renderTicket) return;
        state.adRevenue = { ok: false, empty: true, apps: [], error: e.message || '读取失败' };
      }
      state.adRevenueReady = true;
    }
    if (ticket !== renderTicket) return;
    node.innerHTML = renderAdRevenue(state.adRevenue);
    return;
  }
  const el = new Proxy(node, {
    set(target, prop, value) {
      if (prop === 'innerHTML' && ticket !== renderTicket) return true;
      target[prop] = value;
      return true;
    },
  });
  if (!opts.keep) node.innerHTML = '加载中…';
  try {
    if (state.page === 'cockpit') {
      const grain = state.cockpitGrain || 'day';
      const at = state.cockpitAt || defaultCockpitAt(grain);
      const [d, mapStats, geo] = await Promise.all([
        api('/cockpit?grain=' + encodeURIComponent(grain) + '&at=' + encodeURIComponent(at)),
        api('/user-provinces').catch(() => null),
        loadChinaMap().catch(() => null),
      ]);
      el.innerHTML = renderCockpit(d, mapStats, geo);
      if (ticket !== renderTicket) return;
      bindProvinceMap(node);
    } else if (state.page === 'overview') {
      const d = await api('/overview');

function setupPullToRefresh() {
  const main = document.querySelector('#app main');
  const tip = document.getElementById('pullRefresh');
  if (!main || !tip) return;
  const phone = window.matchMedia('(max-width: 800px)');
  const threshold = 68;
  let startY = 0;
  let startX = 0;
  let tracking = false;
  let dy = 0;
  let busy = false;

  function atTop() {
    return (window.scrollY || document.documentElement.scrollTop || document.body.scrollTop || 0) <= 1;
  }
  function blocked(target) {
    if (!phone.matches || busy) return true;
    if (document.body.classList.contains('nav-open')) return true;
    if (document.querySelector('#modalRoot .modal-bg')) return true;
    if (!document.getElementById('app') || document.getElementById('app').classList.contains('hidden')) return true;
    if (target && target.closest && target.closest('#login, aside, input, textarea, select, button, a')) return true;
    return false;
  }
  const arrow = tip.querySelector('.pull-arrow');
  function show(px, spinning) {
    tip.style.height = px ? px + 'px' : '0px';
    tip.classList.toggle('refreshing', !!spinning);
    if (arrow) {
      if (spinning) {
        arrow.style.opacity = '1';
        arrow.style.transform = '';
      } else {
        const progress = Math.max(0, Math.min(1, px / threshold));
        arrow.style.opacity = progress ? String(0.35 + progress * 0.65) : '0';
        arrow.style.transform = 'rotate(' + Math.round(progress * 320) + 'deg) scale(' + (0.45 + progress * 0.55).toFixed(2) + ')';
      }
    }
    main.style.transform = px ? 'translateY(' + px + 'px)' : '';
  }
  document.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1 || blocked(e.target) || !atTop()) {
      tracking = false;
      return;
    }
    startY = e.touches[0].clientY;
    startX = e.touches[0].clientX;
    dy = 0;
    tracking = true;
    main.style.transition = 'none';
  }, { passive: true });
  document.addEventListener('touchmove', (e) => {
    if (!tracking || busy) return;
    const touch = e.touches[0];
    const rawY = touch.clientY - startY;
    const rawX = Math.abs(touch.clientX - startX);
    if (!atTop()) {
      tracking = false;
      dy = 0;
      show(0, false);
      return;
    }
    if (rawY <= 0) {
      dy = 0;
      show(0, false);
      return;
    }
    if (rawX > rawY && rawX > 12) {
      tracking = false;
      show(0, false);
      return;
    }
    dy = Math.min(96, rawY * 0.5);
    if (e.cancelable) e.preventDefault();
    show(dy, false);
  }, { passive: false });
  document.addEventListener('touchend', async () => {
    if (!tracking) return;
    tracking = false;
    const should = dy >= threshold && !busy;
    dy = 0;
    main.style.transition = 'transform .18s ease';
    if (!should) {
      show(0, false);
      return;
    }
    busy = true;
    show(44, true);
    try {
      await render({ keep: true });
    } finally {
      busy = false;
      show(0, false);
    }
  });
  document.addEventListener('touchcancel', () => {
    tracking = false;
    dy = 0;
    main.style.transition = 'transform .18s ease';
    show(0, false);
  });
}

let refundDraft = null;
let refundBusy = false;
function refundImageOrder(orderId, userId, amountYuan, credits, remaining) {
  const granted = Math.max(0, Number(credits) || 0);
  const left = Math.max(0, Number(remaining) || 0);
  const claw = Math.min(left, granted);
  const used = Math.max(0, granted - claw);
  refundDraft = { orderId, userId, amountYuan: String(amountYuan), claw };
  const usedLine = used > 0
    ? `<p class="sub">其中 ${used} 张已经用掉，钱仍全额退回，这几张不再追回。</p>`
    : '';
  showModal(`<h2>确认退款</h2>
    <p>将把 <b>¥${esc(amountYuan)}</b> 原路退回支付宝，并扣回 <b>${claw}</b> 张配图（本单 ${granted} 张，用户还剩 ${left} 张）。</p>
    ${usedLine}
    <label>退款原因</label>
    <input id="refundReason" value="用户热线退款" />
    <div style="margin-top:16px;display:flex;gap:8px">
      <button class="btn ghost" type="button" onclick="cancelRefund()">取消</button>
      <button class="btn danger" type="button" id="refundConfirmBtn" onclick="confirmRefund()">确认退款</button>
    </div>`, { closeOnBackdrop: false });
}
function cancelRefund() {
  const userId = refundDraft && refundDraft.userId;
  refundDraft = null;
  refundBusy = false;
  if (userId) openUser(userId);
  else closeModal();
}
async function confirmRefund() {
  if (!refundDraft || refundBusy) return;
  refundBusy = true;
  const draft = refundDraft;
  const btn = document.getElementById('refundConfirmBtn');
  if (btn) { btn.disabled = true; btn.textContent = '退款中…'; }
  const reason = (document.getElementById('refundReason')?.value || '').trim() || '用户热线退款';
  try {
    const data = await api('/point-orders/' + draft.orderId + '/refund', {
      method: 'POST',
      body: JSON.stringify({ reason }),
    });
    refundDraft = null;
    alert('已退款 ¥' + (Number(data.refundedFen || 0) / 100).toFixed(2) + '，扣回 ' + (data.clawedCredits || 0) + ' 张，剩余 ' + (data.imageCredits ?? 0) + ' 张');
    if (state.page === 'purchases') {
      closeModal();
      render();
    } else {
      openUser(draft.userId);
    }
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = '确认退款'; }
    alert(e.message);
  } finally {
    refundBusy = false;
  }
}

function renderGiftImages() {
  const box = document.getElementById('gImgList');
  if (!box) return;
  const imgs = window.__giftImages || [];
  if (!imgs.length) {
    box.innerHTML = '<div class="sub">尚未上传图片，将继续用封面底色 + 默认图标展示</div>';
    return;
  }
  box.innerHTML = imgs.map((url, i) => `
    <div style="width:92px;position:relative;background:#111;border:1px solid #333;border-radius:10px;overflow:hidden">
      <img src="${esc(url)}" alt="" style="width:92px;height:92px;object-fit:cover;display:block"/>
      <div class="sub" style="padding:4px 6px;font-size:11px">${i===0?'封面':('图'+(i+1))}</div>
      <div style="display:flex;gap:2px;padding:0 4px 6px">
        <button class="btn ghost small" style="padding:2px 6px" onclick="moveGiftImage(${i},-1)" ${i===0?'disabled':''}>←</button>
        <button class="btn ghost small" style="padding:2px 6px" onclick="moveGiftImage(${i},1)" ${i===imgs.length-1?'disabled':''}>→</button>
        <button class="btn danger small" style="padding:2px 6px;margin-left:auto" onclick="removeGiftImage(${i})">删</button>
      </div>
    </div>`).join('');
}
function moveGiftImage(index, delta) {
  const imgs = window.__giftImages || [];
  const next = index + delta;
  if (next < 0 || next >= imgs.length) return;
  const tmp = imgs[index];
  imgs[index] = imgs[next];
  imgs[next] = tmp;
  renderGiftImages();
}
function removeGiftImage(index) {
  const imgs = window.__giftImages || [];
  imgs.splice(index, 1);
  renderGiftImages();
}
async function uploadGiftImages(input) {
  const files = [...(input?.files || [])];
  if (!files.length) return;
  const hint = document.getElementById('gImgHint');
  const imgs = window.__giftImages || (window.__giftImages = []);
  for (const file of files) {
    if (imgs.length >= 12) {
      alert('最多 12 张图片');
      break;
    }
    if (hint) hint.textContent = '上传中：' + file.name + ' …';
    try {
      const res = await fetch('/admin/api/gifts/upload?filename=' + encodeURIComponent(file.name), {
        method: 'POST',
        headers: {
          Authorization: 'Bearer ' + token(),
          'Content-Type': file.type || 'image/jpeg',
          'X-Filename': file.name,
        },
        body: file,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || '上传失败');
      if (data.url) imgs.push(data.url);
    } catch (e) {
      alert((file.name || '图片') + '：' + (e.message || '上传失败'));
    }
  }
  if (input) input.value = '';
  if (hint) hint.textContent = '支持 jpg / png / webp，单张不超过 12MB，最多 12 张；第 1 张为封面';
  renderGiftImages();
}

    </select>
    <label>关键词（1～30 个，逗号分隔）</label><input id="sKw" value="${esc(kw)}" placeholder="reply, messages, gossip" />
    <label>视频文件</label>
    <input id="sFile" type="file" accept="video/mp4,video/*" />
    <div class="sub" id="sUploadHint">${item.videoUrl ? '当前：'+esc(item.videoUrl) : '请选择 mp4 上传'}</div>
    <label>或直接填视频 URL</label><input id="sUrl" value="${esc(item.videoUrl||'')}" placeholder="/uploads/videos/xxx.mp4" />
    <label>时长（毫秒，可空）</label><input id="sDur" type="number" value="${item.durationMs??''}" />
    <label>排序（越小越靠前）</label><input id="sSort" type="number" value="${item.sortOrder||0}" />
    <label><input id="sPub" type="checkbox" ${item.published!==false?'checked':''}/> 上架</label>
    <div class="toolbar" style="margin-top:14px">
      <button class="btn" onclick="saveShort(${isNew?'null':item.id})">保存</button>
      <button class="btn ghost" onclick="closeModal()">取消</button>
    </div>`, { closeOnBackdrop: false });
  if (isNew) syncShortAuthorFromCategory();
}
async function uploadShortFile() {
  const file = document.getElementById('sFile')?.files?.[0];
  if (!file) return document.getElementById('sUrl').value.trim();
  const hint = document.getElementById('sUploadHint');
  if (hint) hint.textContent = '上传中…';
  const res = await fetch('/admin/api/shorts/upload?filename=' + encodeURIComponent(file.name), {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + token(), 'Content-Type': file.type || 'video/mp4', 'X-Filename': file.name },
    body: file,
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { logout(); throw new Error(data.error || '未登录'); }
  if (!res.ok) throw new Error(data.error || '上传失败');
  document.getElementById('sUrl').value = data.url;
  if (hint) hint.textContent = '已上传：' + data.url;
  return data.url;
}
async function saveShort(id) {
  try {
    let videoUrl = document.getElementById('sUrl').value.trim();
    const file = document.getElementById('sFile')?.files?.[0];
    if (file) videoUrl = await uploadShortFile();
    const keywords = document.getElementById('sKw').value.split(/[,，、\n]/).map(s => s.trim()).filter(Boolean);
    if (keywords.length < 1 || keywords.length > 30) {
      alert('请填写 1～30 个关键词');
      return;
    }
    const body = {
      title: document.getElementById('sTitle').value.trim(),
      author: document.getElementById('sAuthor').value.trim(),
      caption: document.getElementById('sCap').value.trim(),
      category: document.getElementById('sCat').value,
      keywords,
      videoUrl,
      durationMs: document.getElementById('sDur').value === '' ? null : Number(document.getElementById('sDur').value),
      sortOrder: Number(document.getElementById('sSort').value) || 0,
      published: document.getElementById('sPub').checked,
    };
    if (id == null) await api('/shorts', { method: 'POST', body: JSON.stringify(body) });
    else await api('/shorts/' + id, { method: 'PATCH', body: JSON.stringify(body) });
    closeModal(); go('shorts');
  } catch (e) { alert(e.message); }
}
async function toggleShort(id, published) {
  try { await api('/shorts/' + id, { method: 'PATCH', body: JSON.stringify({ published: !published }) }); go('shorts'); }
  catch (e) { alert(e.message); }
}
async function delShort(id) {
  if (!confirm('确定删除该短视频？')) return;
  try { await api('/shorts/' + id, { method: 'DELETE' }); go('shorts'); }
  catch (e) { alert(e.message); }
}
async function setOrderStatus(id, status) {
  try { await api('/gift-orders/' + id, { method: 'PATCH', body: JSON.stringify({ status }) }); go('giftOrders'); }
  catch (e) { alert(e.message); }
}
function showModal(html, opts = {}) {
  const closeOnBackdrop = opts.closeOnBackdrop !== false;
  const bgClick = closeOnBackdrop ? 'onclick="if(event.target===this)closeModal()"' : '';
  document.getElementById('modalRoot').innerHTML =
    `<div class="modal-bg" ${bgClick}><div class="modal">${html}</div></div>`;
  wrapTables(document.getElementById('modalRoot'));
}
function closeModal() { document.getElementById('modalRoot').innerHTML = ''; }

document.getElementById('loginPass').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeNav(); });
setupPullToRefresh();
if (token()) showApp();
</script>
</body>
</html>
